<style>
/* Layout: colourful workbook — every exercise format has its own colour; a segmented progress stripe in the header shows each exercise as a coloured cell that fills when done */
:root {
  --bg: #f6f4ff; --sheet: #ffffff; --ink: #1d1b33; --muted: #625f80; --line: #e2def3;
  --ok: #138a52; --ok-soft: #dcf5e8; --bad: #d1352b; --bad-soft: #fde4e1;

  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #13121f; --sheet: #1d1c2e; --ink: #eeedf8; --muted: #a5a2c4; --line: #33314d;
  --ok: #4ade94; --ok-soft: #133a28; --bad: #ff7b70; --bad-soft: #45201d;
  --k-match: #a78bfa; --k-quiz: #60a5fa; --k-tf: #fb923c; --k-whack: #f472b6; --k-type: #2dd4bf; --k-anagram: #facc15; --k-cloze: #4ade80; --k-unjumble: #fb7185; --k-words: #818cf8; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #13121f; --sheet: #1d1c2e; --ink: #eeedf8; --muted: #a5a2c4; --line: #33314d;
  --ok: #4ade94; --ok-soft: #133a28; --bad: #ff7b70; --bad-soft: #45201d;
  --k-match: #a78bfa; --k-quiz: #60a5fa; --k-tf: #fb923c; --k-whack: #f472b6; --k-type: #2dd4bf; --k-anagram: #facc15; --k-cloze: #4ade80; --k-unjumble: #fb7185; --k-words: #818cf8; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 60px; }
header { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.eyebrow { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--k-words); font-weight: 700; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(30px, 5.5vw, 48px); line-height: 1.02; margin: 4px 0 0; text-wrap: balance; }
.total { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 15px; }
.total b { color: var(--ink); font-size: 24px; font-family: var(--display); }
.stripe { display: flex; gap: 4px; }
.stripe button { all: unset; cursor: pointer; flex: 1; height: 12px; border-radius: 4px; background: color-mix(in srgb, var(--c) 22%, var(--sheet)); border: 1.5px solid var(--c); }
.stripe button.done { background: var(--c); }

.stripe button:focus-visible { outline: 2px solid var(--ink); }
.app { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }

.picker { display: none; }
.sheet { --c: var(--k-words); position: relative; background: var(--sheet); border: 1px solid var(--line); border-top: 8px solid var(--c); border-radius: 16px; padding: clamp(18px, 3vw, 32px); min-width: 0; overflow: hidden; }
.sheet h2 { font-family: var(--display); font-weight: 800; font-size: clamp(24px, 3.4vw, 32px); margin: 8px 0 6px; text-wrap: balance; }
.howto { color: var(--muted); margin: 0 0 22px; max-width: 65ch; }
.kind { display: inline-block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--sheet); background: var(--c); padding: 3px 10px; border-radius: 99px; }
.items { display: flex; flex-direction: column; gap: 20px; }
.item { display: flex; flex-direction: column; gap: 8px; min-width: 0; padding-left: 12px; border-left: 3px solid color-mix(in srgb, var(--c) 30%, transparent); }
.q { font-weight: 600; }
.q .num { color: var(--c); font-variant-numeric: tabular-nums; margin-right: 6px; font-weight: 800; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.btn, .opt, .chip, .tile { font: inherit; color: var(--ink); background: var(--sheet); border: 2px solid color-mix(in srgb, var(--c) 30%, var(--line)); border-radius: 10px; padding: 7px 13px; cursor: pointer; line-height: 1.3; }
.opt:hover:not(:disabled), .chip:hover:not(:disabled), .tile:hover:not(:disabled) { border-color: var(--c); background: color-mix(in srgb, var(--c) 8%, var(--sheet)); }
.opt:focus-visible, .chip:focus-visible, .btn:focus-visible, .tile:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }
.opt:disabled, .chip:disabled { cursor: default; }
.ok { background: var(--ok-soft) !important; border-color: var(--ok) !important; color: var(--ok) !important; font-weight: 600; }
.bad { background: var(--bad-soft) !important; border-color: var(--bad) !important; color: var(--bad) !important; }
.sel { background: color-mix(in srgb, var(--c) 18%, var(--sheet)) !important; border-color: var(--c) !important; }
.miss { border-style: dashed !important; border-color: var(--ok) !important; color: var(--ok) !important; }
.btn.primary { background: var(--c); border-color: var(--c); color: var(--sheet); font-weight: 700; }
.btn.primary:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: transparent; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.fb { font-size: 15px; font-weight: 600; }
.fb.okt { color: var(--ok); } .fb.badt { color: var(--bad); }
.fb .hint { font-weight: 400; }
input[type=text] { font: inherit; color: var(--ink); background: color-mix(in srgb, var(--c) 6%, var(--sheet)); border: 2px solid color-mix(in srgb, var(--c) 30%, var(--line)); border-radius: 10px; padding: 7px 11px; width: min(100%, 380px); }
input.ok, input.bad { font-weight: 600; }
select { font: inherit; font-weight: 600; color: var(--c); background: color-mix(in srgb, var(--c) 10%, var(--sheet)); border: 2px solid color-mix(in srgb, var(--c) 40%, var(--line)); border-radius: 8px; padding: 1px 4px; max-width: 100%; }
.cloze { line-height: 2.4; max-width: 72ch; }
.bank { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; padding: 12px; background: color-mix(in srgb, var(--c) 9%, var(--sheet)); border-radius: 12px; }
.bank span { font-size: 15px; font-weight: 600; padding: 2px 10px; border-radius: 99px; border: 1.5px solid color-mix(in srgb, var(--c) 40%, var(--line)); background: var(--sheet); }
.match { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px 14px; }
.match .col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.match .chip { text-align: left; width: 100%; position: relative; padding-left: 36px; min-height: 44px; }
.match .chip .tag { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; border-radius: 50%; font-size: 11px; font-weight: 700; display: grid; place-items: center; background: var(--line); color: var(--muted); font-variant-numeric: tabular-nums; }
.match .chip.paired .tag { background: var(--c); color: var(--sheet); }
.answer-line { min-height: 48px; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; border: 2px dashed color-mix(in srgb, var(--c) 45%, var(--line)); border-radius: 12px; background: color-mix(in srgb, var(--c) 5%, var(--sheet)); }
.tiles { display: flex; flex-wrap: wrap; gap: 6px; }
.tile { min-width: 42px; text-align: center; font-weight: 800; font-size: 18px; text-transform: lowercase; background: color-mix(in srgb, var(--c) 14%, var(--sheet)); }
.tile:disabled { opacity: .25; }
.hint { color: var(--muted); font-size: 15px; }
.foot { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; margin-top: 28px; padding-top: 18px; border-top: 2px dashed var(--line); }
.result { font-family: var(--display); font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--c); }
table.words { width: 100%; border-collapse: collapse; font-size: 16px; }
table.words td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.words tr:nth-child(even) td { background: color-mix(in srgb, var(--k-words) 5%, var(--sheet)); }
table.words td:first-child { font-weight: 700; width: 44%; color: var(--k-words); }
.tw { overflow-x: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
.legend span { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 99px; color: var(--c); background: color-mix(in srgb, var(--c) 13%, var(--sheet)); }
.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.confetti i { position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 2px; opacity: .9; }
@media (prefers-reduced-motion: no-preference) {
  .opt, .chip, .tile, nav button { transition: background .12s, border-color .12s; }
  .confetti i { animation: fall 1.6s ease-in forwards; }
  @keyframes fall { to { transform: translateY(520px) rotate(540deg); opacity: 0; } }
}
@media (prefers-reduced-motion: reduce) { .confetti { display: none; } }
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  nav { display: none; }
  .picker { display: block; margin-bottom: 12px; }
  .picker select { width: 100%; padding: 10px; font-size: 16px; border-radius: 10px; color: var(--ink); }
  .match { grid-template-columns: minmax(0, 1fr); }
}
.card { perspective: 1200px; width: 100%; max-width: 620px; height: 270px; margin: 0 auto; cursor: pointer; }
.card-in { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; }
.card.flipped .card-in { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; border-radius: 20px; text-align: center; }

.face .tip { position: absolute; bottom: 12px; font-size: 13px; opacity: .75; }

.front { background: var(--c); color: var(--sheet); }
.back { background: color-mix(in srgb, var(--c) 12%, var(--sheet)); color: var(--ink); border: 3px solid var(--c); transform: rotateY(180deg); }
.card:focus-visible { outline: 3px solid var(--c); outline-offset: 4px; border-radius: 20px; }
.cardbar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; margin-top: 16px; }

.btn.know { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); font-weight: 700; }
.btn.learn { background: color-mix(in srgb, var(--k-tf) 14%, var(--sheet)); border-color: var(--k-tf); color: var(--k-tf); font-weight: 700; }
.btn.say { font-weight: 700; }
.toggles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 16px; }
.toggles .btn.on { background: var(--c); border-color: var(--c); color: var(--sheet); font-weight: 700; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; max-width: 620px; margin: 0 auto 16px; }
.bar i { display: block; height: 100%; background: var(--ok); }
.keys { text-align: center; color: var(--muted); font-size: 14px; margin-top: 14px; }
.spk { font: inherit; font-size: 14px; border: 1.5px solid var(--line); background: var(--sheet); color: var(--k-words); border-radius: 8px; padding: 2px 8px; cursor: pointer; margin-left: 8px; }
.spk:focus-visible { outline: 2px solid var(--k-words); }
@media (prefers-reduced-motion: no-preference) { .card-in { transition: transform .45s; } }
@media (max-width: 820px) { .card { height: 240px; } }
.fb.partt { color: var(--c); }
.endcol { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.review { display: flex; flex-direction: column; gap: 6px; width: 100%; margin-top: 4px; }
.rv { font-size: 15px; padding: 6px 10px; border-radius: 8px; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: baseline; }
.rv.rv-ok { background: var(--ok-soft); color: var(--ok); }
.rv.rv-bad { background: var(--bad-soft); color: var(--bad); }

.item.rv-ok { border-left-color: var(--ok); }
.item.rv-bad { border-left-color: var(--bad); }
.gapn { font-size: 11px; font-weight: 700; color: var(--c); margin: 0 2px 0 4px; }
.foot { align-items: flex-start; }
.match .lcol .chip { background: color-mix(in srgb, var(--c) 14%, var(--sheet)); border-color: color-mix(in srgb, var(--c) 50%, var(--line)); font-weight: 600; }

.colh { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; font-weight: 800; color: var(--c); padding: 2px 4px; }

/* Pastel theme: the teacher's palette as fills (--p-*), deeper tones of the same hues for text and borders (--k-*) */
:root {
  --k-match: #7a2fa5; --k-quiz: #735600; --k-tf: #6e5b00; --k-whack: #a8326e; --k-type: #08707a; --k-anagram: #8a4a00; --k-cloze: #146f4b; --k-unjumble: #0f6f64; --k-words: #5a3fc0;

  --p: var(--p-words);
  --ok: #146f4b; --ok-soft: #c6f8e5; --bad: #b3261e; --bad-soft: #ffe1ea;

.welcome { display: flex; align-items: center; gap: 18px; padding: 16px 18px; margin: 0 0 22px; border-radius: 18px; background: linear-gradient(120deg, var(--frame-a), var(--frame-b)); color: var(--ink); }
.welcome img { width: 136px; height: 136px; border-radius: 50%; object-fit: cover; border: 4px solid var(--sheet); flex: none; }
.welcome b { font-family: var(--display); font-size: 24px; font-weight: 800; }
.welcome p { margin: 4px 0 0; max-width: 60ch; }
@media (max-width: 520px) { .teacher img { width: 72px; height: 72px; } .welcome img { width: 120px; height: 120px; } .welcome { flex-direction: column; text-align: center; } .teacher { border-radius: 18px; } }
.homeh { font-family: var(--display); font-weight: 800; font-size: 20px; margin: 22px 0 10px; }
.tilegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.xtile { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-height: 120px; padding: 14px; border-radius: 16px; background: var(--p); border: 2px solid var(--p); color: var(--ink); }
.xtile:hover { border-color: var(--c); transform: translateY(-2px); }
.xtile:focus-visible { outline: 3px solid var(--c); outline-offset: 2px; }
.xtop { display: flex; justify-content: space-between; align-items: center; }
.xnum { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: var(--sheet); color: var(--c); font-weight: 800; font-variant-numeric: tabular-nums; }
.xsc { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--sheet); color: var(--muted); font-variant-numeric: tabular-nums; }
.xsc.full { color: var(--ok); }
.xtitle { font-weight: 700; line-height: 1.25; }
.xlabel { margin-top: auto; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; color: var(--c); }
@media (prefers-reduced-motion: no-preference) { .xtile { transition: transform .12s, border-color .12s; } }
@media (max-width: 520px) { .tilegrid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .xtile { min-height: 110px; padding: 12px; } }
.tid { font-size: 15px; color: var(--ink); }
.tid a { color: var(--k-whack); font-weight: 600; text-decoration: none; }
.tid a:hover { text-decoration: underline; }
.credit { margin-top: 28px; padding: 18px 20px; border-radius: 20px; background: color-mix(in srgb, var(--sheet) 70%, transparent); border: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.credit p { margin: 0; color: var(--muted); font-size: 15px; min-width: 0; }
.credit p b { color: var(--ink); }
.credit-links { display: flex; flex-wrap: wrap; gap: 10px; }
.credit a { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 700; padding: 9px 16px; border-radius: 14px; }
.credit a.book { background: var(--k-whack); color: var(--sheet); }
.credit a.book:hover { filter: brightness(1.08); }
.credit a.ig { background: var(--p-whack); color: var(--k-whack); border: 2px solid var(--p-whack); }
.credit a.ig:hover { border-color: var(--k-whack); }
.credit a:focus-visible, .tid a:focus-visible { outline: 3px solid var(--k-whack); outline-offset: 2px; }
/* Photo frame: fixed colours chosen by the teacher; they stay the same whatever the palette */
:root { --frame-1: #d1f8fd; --frame-2: #ffe2f2; --frame-a: #d8f9e9; --frame-b: #fff2c3; --brand-red: #d0101c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --brand-red: #ff6b6b; } }
:root[data-theme="dark"] { --brand-red: #ff6b6b; }
.welcome { color: #2a2440; }
h1, .welcome b, .homeh { color: var(--brand-red); }
.sendbox { margin-top: 26px; padding: 18px 20px; border-radius: 20px; background: linear-gradient(120deg, var(--frame-a), var(--frame-b)); color: #2a2440; display: flex; flex-direction: column; gap: 8px; }
.sendbox .homeh { margin: 0; }
.sendbox .hint { margin: 0 0 4px; color: #4a4466; }
.sendbox.compact { margin-top: 6px; padding: 14px 16px; }
.slab { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #4a4466; }
.sendbox input[type=text] { background: #ffffff; color: #2a2440; }
.sendbtn { text-decoration: none; display: inline-flex; align-items: center; }
.sendbox .btn:not(.primary) { background: #ffffff; color: #2a2440; }
.copyta { width: 100%; min-height: 120px; font: inherit; font-size: 14px; border-radius: 10px; padding: 8px; }
/* Additions for this trainer: open cloze (turquoise), reading-style passage, parts, rules */
:root { --k-open: var(--k-type); --p-open: var(--p-type); }
.cloze { white-space: pre-line; }
.passage { background: var(--p-words); border-radius: 18px; padding: 16px 20px; margin: 0 0 22px; line-height: 1.75; max-width: 75ch; color: var(--ink); }
.passage b { color: var(--k-words); }
input.gapin { width: auto; min-width: 60px; padding: 1px 8px; margin: 0 2px; font-size: 16px; line-height: 1.4; border-width: 2px; border-radius: 10px; }
.cloze:has(input.gapin) { line-height: 2.3; }
.q b { color: var(--c); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.parth { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; font-weight: 800; color: var(--muted); margin: 18px 0 8px; }
.rules h3 { font-family: var(--display); font-weight: 800; font-size: 22px; margin: 26px 0 8px; color: var(--k-words); }
.rules h4 { font-weight: 700; font-size: 18px; margin: 18px 0 6px; }
.rules p, .rules li { max-width: 72ch; }
.rules ul { margin: 6px 0; padding-left: 22px; }
.rules .ex { color: var(--muted); font-style: italic; }
.rules .note { background: var(--p-words); border-radius: 14px; padding: 10px 14px; margin: 10px 0; }
.rules table { border-collapse: collapse; width: 100%; font-size: 16px; margin: 8px 0; }
.rules th, .rules td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.rules th { background: var(--p-words); color: var(--k-words); font-size: 14px; letter-spacing: .04em; text-transform: uppercase; }
</style>
</head>

// Open cloze: a text with typed gaps, **answer|other accepted answer**
function openCloze(ex, box, ctl) {
  const parts = ex.text.split(/\*\*(.+?)\*\*/);
  const p = el('div', 'cloze'), ins = [], fb = el('div', 'fb');
  let gi = 0;
  parts.forEach((t, k) => {
    if (k % 2 === 0) { p.append(document.createTextNode(t)); return; }
    const i = gi++, acc = t.split('|');
    ctl.answers[i] = acc[0]; ctl.labels[i] = 'gap ' + (i + 1); ctl.fb[i] = fb;
    const inp = el('input', 'gapin'); inp.type = 'text'; inp.autocomplete = 'off'; inp.spellcheck = false; inp.setAttribute('autocapitalize', 'off');
    inp.setAttribute('aria-label', 'Gap ' + (i + 1)); inp.size = Math.max(5, Math.max(...acc.map(a => a.length)));
    let last = '';
    const check = () => {
      const v = inp.value.trim(); if (!v || inp.disabled || v === last) return; last = v;
      if (acc.some(a => norm(a) === norm(v))) { inp.classList.remove('bad'); inp.classList.add('ok'); inp.disabled = true; ctl.right(i); }
      else { inp.classList.add('bad'); ctl.wrong(i); }
    };
    inp.oninput = () => inp.classList.remove('bad');
    inp.onkeydown = e => { if (e.key === 'Enter') { check(); const nx = ins.find(x => !x.disabled && x !== inp); if (inp.disabled && nx) nx.focus(); } };
    inp.onchange = check;
    ins.push(inp); p.append(el('sup', 'gapn', String(i + 1)), inp);

  ctl.lockers.push(() => ins.forEach(x => x.disabled = true));
  box.append(p, fb);
}

function rules(s) {
  s.append(el('span', 'kind', 'Before you start'), el('h2', '', 'Rules: grammar of Unit 1'), el('p', 'howto', 'Read the short rules and examples, then practise them in Parts 3 and 6.'));
  const r = el('div', 'rules');
  r.innerHTML = `
<h3>1. Conditional forms (Unit 1A)</h3>
<h4>Mixed conditionals</h4>
<p>We mix two times: the condition is about one time, the result is about another time.</p>
<div class="tw"><table>
<tr><th>Condition</th><th>Result</th><th>Example</th></tr>
<tr><td>past → <b>if + past perfect</b></td><td>present → <b>would + infinitive</b></td><td>If I <b>had studied</b> medicine, I <b>would be</b> a doctor now.</td></tr>
<tr><td>present (always true) → <b>if + past simple</b></td><td>past → <b>would have + past participle</b></td><td>If she <b>weren't</b> so shy, she <b>would have spoken</b> up yesterday.</td></tr>
</table></div>
<h4>Other words instead of <i>if</i></h4>
<ul>
<li><b>provided / providing (that), as long as, so long as, on condition (that)</b> = only if. <span class="ex">You can borrow my car provided (that) you bring it back by six.</span></li>
<li><b>unless</b> = if … not. Don't use another <i>not</i>. <span class="ex">We'll lose the client unless we lower the price.</span></li>
<li><b>even if</b> = it doesn't matter if. <span class="ex">I wouldn't take that job even if they doubled my salary.</span></li>
<li><b>whether … or not / whether or not</b> = in both cases. <span class="ex">I'm going whether you come with me or not.</span></li>
<li><b>but for / without + noun</b> = if it weren't for / if it hadn't been for. <span class="ex">But for his support, I would never have finished my thesis.</span></li>
<li><b>If it weren't for + noun</b> (present) · <b>If it hadn't been for + noun</b> (past). <span class="ex">If it weren't for the rain, we'd be in the garden now.</span></li>
</ul>
<div class="note">After <b>provided, as long as, unless, if</b> we use a present tense for the future, not <i>will</i>: <span class="ex">Providing you finish your homework, you can go out.</span></div>
<h4>Inversion (more formal) — no <i>if</i></h4>
<div class="tw"><table>
<tr><th>With if</th><th>Inversion</th></tr>
<tr><td>If you should need help, …</td><td><b>Should you need</b> help, …</td></tr>
<tr><td>If I were to win the lottery, …</td><td><b>Were I to win</b> the lottery, …</td></tr>
<tr><td>If we had known, …</td><td><b>Had we known</b>, …</td></tr>
<tr><td>If she hadn't been so tired, …</td><td><b>Had she not been</b> so tired, … (not <i>Hadn't she been</i>)</td></tr>
<tr><td>If it hadn't been for the rain, …</td><td><b>Had it not been for</b> the rain, …</td></tr>
</table></div>
<h3>2. Nominal relative clauses (Unit 1B)</h3>
<p>A nominal relative clause works like a noun. The relative word already contains the noun, so we don't add <i>the thing</i>, <i>the person</i>, etc.</p>
<div class="tw"><table>
<tr><th>Word</th><th>Meaning</th><th>Example</th></tr>
<tr><td><b>what</b></td><td>the thing(s) that</td><td><b>What</b> he said made no sense.</td></tr>
<tr><td><b>whoever</b></td><td>any person who / the person who</td><td><b>Whoever</b> finishes first can leave.</td></tr>
<tr><td><b>whatever</b></td><td>anything that</td><td>I'll eat <b>whatever</b> you cook.</td></tr>
<tr><td><b>whichever</b></td><td>any one (from a limited choice)</td><td>Take <b>whichever</b> you prefer.</td></tr>
<tr><td><b>whenever</b></td><td>any time that</td><td>Call me <b>whenever</b> you need to talk.</td></tr>
<tr><td><b>wherever</b></td><td>any place that</td><td>Sit <b>wherever</b> you like.</td></tr>
<tr><td><b>however</b></td><td>in any way / it doesn't matter how</td><td><b>However</b> hard I try, I can't remember names.</td></tr>
<tr><td><b>where, when, why, how</b></td><td>the place / time / reason / way</td><td>Tell me <b>where</b> you hid the keys.</td></tr>
</table></div>
<h4>Emphasis with <i>What …</i></h4>
<p>To make an idea stronger, start with <b>What + clause + be</b>: <span class="ex">I need a cup of coffee. → <b>What I need is</b> a cup of coffee.</span> <span class="ex">Her attitude surprised me. → <b>What surprised me was</b> her attitude.</span></p>
<div class="note">Common mistakes: <i>It's a book <s>what</s> changed my life</i> → <b>that / which</b> (after a noun). <i>What she said <s>it</s> was true</i> → <b>What she said was true.</b></div>`;
  s.append(r);
  const f = el('div', 'foot'), r2 = el('div', 'row'), b = el('button', 'btn primary', 'Practise conditional forms →'), b2 = el('button', 'btn', 'Practise nominal relative clauses');

}

    const card = el('div', 'card'); card.tabIndex = 0; card.setAttribute('role', 'button'); card.setAttribute('aria-label', 'Card: ' + frontText + '. Tap to turn over');
    const inn = el('div', 'card-in'), f = el('div', 'face front'), b = el('div', 'face back');
    f.append(el('span', 'lbl', cardState.dir === 'en' ? 'English' : 'Ukrainian'), el('div', 'big', frontText), el('span', 'tip', 'tap to turn over'));
    b.append(el('span', 'lbl', cardState.dir === 'en' ? 'Ukrainian' : 'English'), el('div', 'big', backText));
    if (known.has(i)) { const k = el('span', 'lbl', '✓ I know it'); k.style.left = 'auto'; k.style.right = '18px'; f.append(k); }
    inn.append(f, b); card.append(inn);
    const flip = () => { card.classList.toggle('flipped'); if (cardState.auto && cardState.dir === 'ua' && card.classList.contains('flipped')) say(en); };
    card.onclick = flip; card.onkeydown = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } };
    const go = d => { cardState.pos = (cardState.pos + d + ord.length) % ord.length; draw(); };
    const nb = el('div', 'cardbar');
    const prev = el('button', 'btn', '← Back'), next = el('button', 'btn', 'Next →'), sayB = el('button', 'btn say', '🔊 Listen'), cnt = el('span', 'count', (cardState.pos + 1) + ' / ' + ord.length);
    prev.onclick = () => go(-1); next.onclick = () => go(1); sayB.onclick = () => say(en);
    nb.append(prev, cnt, next);
    const kb = el('div', 'cardbar'), kn = el('button', 'btn know', '✓ I know it'), lr = el('button', 'btn learn', '↻ Still learning');
    kn.onclick = () => { known.add(i); saveKnown(); if (cardState.onlyLearning) { ord.splice(cardState.pos, 1); if (cardState.pos >= ord.length) cardState.pos = 0; draw(); } else go(1); };
    lr.onclick = () => { known.delete(i); saveKnown(); go(1); };
    kb.append(sayB, lr, kn);
    body.append(card, nb, kb, el('div', 'keys', 'On a computer: Space turns the card over, ← → move between cards.'));
    if (cardState.auto && cardState.dir === 'en') say(en);
    cardKeys = e => { if (current !== -2 || /input|select|textarea/i.test(e.target.tagName)) return; if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1); else if (e.key === ' ' && e.target === document.body) { e.preventDefault(); flip(); } };
  }
  draw();
}
document.addEventListener('keydown', e => { if (cardKeys) cardKeys(e); });

open(-3);
</script>

</body>
</html>
