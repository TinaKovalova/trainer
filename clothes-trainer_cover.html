<title>Clothes &amp; Moving Abroad + Revision Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
  /* Layout: colourful workbook — every exercise format has its own colour; a segmented progress stripe in the header shows each exercise as a coloured cell that fills when done */
  :root {
    --bg: #f6f4ff;
    --sheet: #ffffff;
    --ink: #1d1b33;
    --muted: #625f80;
    --line: #e2def3;
    --ok: #138a52;
    --ok-soft: #dcf5e8;
    --bad: #d1352b;
    --bad-soft: #fde4e1;
    --k-match: #7b3fe4;
    --k-quiz: #2563eb;
    --k-tf: #ea6a0c;
    --k-whack: #db2777;
    --k-type: #0d9488;
    --k-anagram: #c08a00;
    --k-cloze: #16a34a;
    --k-unjumble: #e0453a;
    --k-words: #4f46e5;
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #13121f;
      --sheet: #1d1c2e;
      --ink: #eeedf8;
      --muted: #a5a2c4;
      --line: #33314d;
      --ok: #4ade94;
      --ok-soft: #133a28;
      --bad: #ff7b70;
      --bad-soft: #45201d;
      --k-match: #a78bfa;
      --k-quiz: #60a5fa;
      --k-tf: #fb923c;
      --k-whack: #f472b6;
      --k-type: #2dd4bf;
      --k-anagram: #facc15;
      --k-cloze: #4ade80;
      --k-unjumble: #fb7185;
      --k-words: #818cf8;
      color-scheme: dark
    }
  }

  :root[data-theme="dark"] {
    --bg: #13121f;
    --sheet: #1d1c2e;
    --ink: #eeedf8;
    --muted: #a5a2c4;
    --line: #33314d;
    --ok: #4ade94;
    --ok-soft: #133a28;
    --bad: #ff7b70;
    --bad-soft: #45201d;
    --k-match: #a78bfa;
    --k-quiz: #60a5fa;
    --k-tf: #fb923c;
    --k-whack: #f472b6;
    --k-type: #2dd4bf;
    --k-anagram: #facc15;
    --k-cloze: #4ade80;
    --k-unjumble: #fb7185;
    --k-words: #818cf8;
    color-scheme: dark
  }

  * {
    box-sizing: border-box
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.5;
  }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 20px 60px;
  }

  header {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 20px;
  }

  .top {
    display: flex;
    flex-wrap: wrap;
    align-items: end;
    justify-content: space-between;
    gap: 12px;
  }

  .eyebrow {
    font-size: 13px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--k-words);
    font-weight: 700;
  }

  h1 {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(30px, 5.5vw, 48px);
    line-height: 1.02;
    margin: 4px 0 0;
    text-wrap: balance;
  }

  .total {
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    font-size: 15px;
  }

  .total b {
    color: var(--ink);
    font-size: 24px;
    font-family: var(--display);
  }

  .stripe {
    display: flex;
    gap: 4px;
  }

  .stripe button {
    all: unset;
    cursor: pointer;
    flex: 1;
    height: 12px;
    border-radius: 4px;
    background: color-mix(in srgb, var(--c) 22%, var(--sheet));
    border: 1.5px solid var(--c);
  }

  .stripe button.done {
    background: var(--c);
  }

  .stripe button.on {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }

  .stripe button:focus-visible {
    outline: 2px solid var(--ink);
  }

  .app {
    display: grid;
    grid-template-columns: 300px minmax(0, 1fr);
    gap: 20px;
    align-items: start;
  }

  nav {
    position: sticky;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    max-height: calc(100vh - 40px);
    overflow: auto;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  nav button {
    all: unset;
    cursor: pointer;
    display: grid;
    grid-template-columns: 30px 1fr auto;
    gap: 8px;
    align-items: center;
    padding: 7px 10px;
    border-radius: 10px;
    font-size: 15px;
    line-height: 1.25;
    color: var(--ink);
  }

  nav button:hover {
    background: color-mix(in srgb, var(--c) 12%, transparent);
  }

  nav button:focus-visible {
    outline: 2px solid var(--c);
  }

  nav button.on {
    background: color-mix(in srgb, var(--c) 16%, var(--sheet));
    font-weight: 600;
  }

  nav .n {
    width: 26px;
    height: 26px;
    border-radius: 8px;
    display: grid;
    place-items: center;
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    font-weight: 700;
    background: color-mix(in srgb, var(--c) 18%, var(--sheet));
    color: var(--c);
  }

  nav button.on .n {
    background: var(--c);
    color: var(--sheet);
  }

  nav .sc {
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    padding: 1px 7px;
    border-radius: 99px;
    background: var(--line);
    color: var(--muted);
  }

  nav .sc:empty {
    display: none;
  }

  nav .sc.full {
    background: var(--ok-soft);
    color: var(--ok);
    font-weight: 700;
  }

  nav .sep {
    margin: 10px 10px 4px;
    font-size: 12px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 700;
  }

  .picker {
    display: none;
  }

  .sheet {
    --c: var(--k-words);
    position: relative;
    background: var(--sheet);
    border: 1px solid var(--line);
    border-top: 8px solid var(--c);
    border-radius: 16px;
    padding: clamp(18px, 3vw, 32px);
    min-width: 0;
    overflow: hidden;
  }

  .sheet h2 {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(24px, 3.4vw, 32px);
    margin: 8px 0 6px;
    text-wrap: balance;
  }

  .howto {
    color: var(--muted);
    margin: 0 0 22px;
    max-width: 65ch;
  }

  .kind {
    display: inline-block;
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--sheet);
    background: var(--c);
    padding: 3px 10px;
    border-radius: 99px;
  }

  .items {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .item {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
    padding-left: 12px;
    border-left: 3px solid color-mix(in srgb, var(--c) 30%, transparent);
  }

  .q {
    font-weight: 600;
  }

  .q .num {
    color: var(--c);
    font-variant-numeric: tabular-nums;
    margin-right: 6px;
    font-weight: 800;
  }

  .opts {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .btn,
  .opt,
  .chip,
  .tile {
    font: inherit;
    color: var(--ink);
    background: var(--sheet);
    border: 2px solid color-mix(in srgb, var(--c) 30%, var(--line));
    border-radius: 10px;
    padding: 7px 13px;
    cursor: pointer;
    line-height: 1.3;
  }

  .opt:hover:not(:disabled),
  .chip:hover:not(:disabled),
  .tile:hover:not(:disabled) {
    border-color: var(--c);
    background: color-mix(in srgb, var(--c) 8%, var(--sheet));
  }

  .opt:focus-visible,
  .chip:focus-visible,
  .btn:focus-visible,
  .tile:focus-visible,
  input:focus-visible,
  select:focus-visible {
    outline: 2px solid var(--c);
    outline-offset: 2px;
  }

  .opt:disabled,
  .chip:disabled {
    cursor: default;
  }

  .ok {
    background: var(--ok-soft) !important;
    border-color: var(--ok) !important;
    color: var(--ok) !important;
    font-weight: 600;
  }

  .bad {
    background: var(--bad-soft) !important;
    border-color: var(--bad) !important;
    color: var(--bad) !important;
  }

  .sel {
    background: color-mix(in srgb, var(--c) 18%, var(--sheet)) !important;
    border-color: var(--c) !important;
  }

  .miss {
    border-style: dashed !important;
    border-color: var(--ok) !important;
    color: var(--ok) !important;
  }

  .btn.primary {
    background: var(--c);
    border-color: var(--c);
    color: var(--sheet);
    font-weight: 700;
  }

  .btn.primary:disabled {
    opacity: .45;
    cursor: default;
  }

  .btn.ghost {
    background: transparent;
  }

  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }

  .fb {
    font-size: 15px;
    font-weight: 600;
  }

  .fb.okt {
    color: var(--ok);
  }

  .fb.badt {
    color: var(--bad);
  }

  .fb .hint {
    font-weight: 400;
  }

  input[type=text] {
    font: inherit;
    color: var(--ink);
    background: color-mix(in srgb, var(--c) 6%, var(--sheet));
    border: 2px solid color-mix(in srgb, var(--c) 30%, var(--line));
    border-radius: 10px;
    padding: 7px 11px;
    width: min(100%, 380px);
  }

  input.ok,
  input.bad {
    font-weight: 600;
  }

  select {
    font: inherit;
    font-weight: 600;
    color: var(--c);
    background: color-mix(in srgb, var(--c) 10%, var(--sheet));
    border: 2px solid color-mix(in srgb, var(--c) 40%, var(--line));
    border-radius: 8px;
    padding: 1px 4px;
    max-width: 100%;
  }

  .cloze {
    line-height: 2.4;
    max-width: 72ch;
  }

  .bank {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 0 0 16px;
    padding: 12px;
    background: color-mix(in srgb, var(--c) 9%, var(--sheet));
    border-radius: 12px;
  }

  .bank span {
    font-size: 15px;
    font-weight: 600;
    padding: 2px 10px;
    border-radius: 99px;
    border: 1.5px solid color-mix(in srgb, var(--c) 40%, var(--line));
    background: var(--sheet);
  }

  .match {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 8px 14px;
  }

  .match .col {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
  }

  .match .chip {
    text-align: left;
    width: 100%;
    position: relative;
    padding-left: 36px;
    min-height: 44px;
  }

  .match .chip .tag {
    position: absolute;
    left: 9px;
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    border-radius: 50%;
    font-size: 11px;
    font-weight: 700;
    display: grid;
    place-items: center;
    background: var(--line);
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .match .chip.paired .tag {
    background: var(--c);
    color: var(--sheet);
  }

  .answer-line {
    min-height: 48px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px;
    border: 2px dashed color-mix(in srgb, var(--c) 45%, var(--line));
    border-radius: 12px;
    background: color-mix(in srgb, var(--c) 5%, var(--sheet));
  }

  .tiles {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .tile {
    min-width: 42px;
    text-align: center;
    font-weight: 800;
    font-size: 18px;
    text-transform: lowercase;
    background: color-mix(in srgb, var(--c) 14%, var(--sheet));
  }

  .tile:disabled {
    opacity: .25;
  }

  .hint {
    color: var(--muted);
    font-size: 15px;
  }

  .foot {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: space-between;
    align-items: center;
    margin-top: 28px;
    padding-top: 18px;
    border-top: 2px dashed var(--line);
  }

  .result {
    font-family: var(--display);
    font-size: 22px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--c);
  }

  table.words {
    width: 100%;
    border-collapse: collapse;
    font-size: 16px;
  }

  table.words td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }

  table.words tr:nth-child(even) td {
    background: color-mix(in srgb, var(--k-words) 5%, var(--sheet));
  }

  table.words td:first-child {
    font-weight: 700;
    width: 44%;
    color: var(--k-words);
  }

  .tw {
    overflow-x: auto;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 0 0 18px;
  }

  .legend span {
    font-size: 13px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 99px;
    color: var(--c);
    background: color-mix(in srgb, var(--c) 13%, var(--sheet));
  }

  .confetti {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .confetti i {
    position: absolute;
    top: -12px;
    width: 9px;
    height: 14px;
    border-radius: 2px;
    opacity: .9;
  }

  @media (prefers-reduced-motion: no-preference) {

    .opt,
    .chip,
    .tile,
    nav button {
      transition: background .12s, border-color .12s;
    }

    .confetti i {
      animation: fall 1.6s ease-in forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(520px) rotate(540deg);
        opacity: 0;
      }
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .confetti {
      display: none;
    }
  }

  @media (max-width: 820px) {
    .app {
      grid-template-columns: minmax(0, 1fr);
    }

    nav {
      display: none;
    }

    .picker {
      display: block;
      margin-bottom: 12px;
    }

    .picker select {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border-radius: 10px;
      color: var(--ink);
    }

    .match {
      grid-template-columns: minmax(0, 1fr);
    }
  }

  .card {
    perspective: 1200px;
    width: 100%;
    max-width: 620px;
    height: 270px;
    margin: 0 auto;
    cursor: pointer;
  }

  .card-in {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
  }

  .card.flipped .card-in {
    transform: rotateY(180deg);
  }

  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 24px;
    border-radius: 20px;
    text-align: center;
  }

  .face .lbl {
    position: absolute;
    top: 14px;
    left: 18px;
    font-size: 12px;
    letter-spacing: .1em;
    text-transform: uppercase;
    font-weight: 700;
    opacity: .8;
  }

  .face .tip {
    position: absolute;
    bottom: 12px;
    font-size: 13px;
    opacity: .75;
  }

  .face .big {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(24px, 4.6vw, 36px);
    line-height: 1.15;
    text-wrap: balance;
  }

  .front {
    background: var(--c);
    color: var(--sheet);
  }

  .back {
    background: color-mix(in srgb, var(--c) 12%, var(--sheet));
    color: var(--ink);
    border: 3px solid var(--c);
    transform: rotateY(180deg);
  }

  .card:focus-visible {
    outline: 3px solid var(--c);
    outline-offset: 4px;
    border-radius: 20px;
  }

  .cardbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    align-items: center;
    margin-top: 16px;
  }

  .cardbar .count {
    font-family: var(--display);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    min-width: 84px;
    text-align: center;
  }

  .btn.know {
    background: var(--ok-soft);
    border-color: var(--ok);
    color: var(--ok);
    font-weight: 700;
  }

  .btn.learn {
    background: color-mix(in srgb, var(--k-tf) 14%, var(--sheet));
    border-color: var(--k-tf);
    color: var(--k-tf);
    font-weight: 700;
  }

  .btn.say {
    font-weight: 700;
  }

  .toggles {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 16px;
  }

  .toggles .btn.on {
    background: var(--c);
    border-color: var(--c);
    color: var(--sheet);
    font-weight: 700;
  }

  .bar {
    height: 8px;
    border-radius: 99px;
    background: var(--line);
    overflow: hidden;
    max-width: 620px;
    margin: 0 auto 16px;
  }

  .bar i {
    display: block;
    height: 100%;
    background: var(--ok);
  }

  .keys {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin-top: 14px;
  }

  .spk {
    font: inherit;
    font-size: 14px;
    border: 1.5px solid var(--line);
    background: var(--sheet);
    color: var(--k-words);
    border-radius: 8px;
    padding: 2px 8px;
    cursor: pointer;
    margin-left: 8px;
  }

  .spk:focus-visible {
    outline: 2px solid var(--k-words);
  }

  @media (prefers-reduced-motion: no-preference) {
    .card-in {
      transition: transform .45s;
    }
  }

  @media (max-width: 820px) {
    .card {
      height: 240px;
    }
  }

  .fb.partt {
    color: var(--c);
  }

  .endcol {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
  }

  .review {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
    margin-top: 4px;
  }

  .rv {
    font-size: 15px;
    padding: 6px 10px;
    border-radius: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 6px;
    align-items: baseline;
  }

  .rv.rv-ok {
    background: var(--ok-soft);
    color: var(--ok);
  }

  .rv.rv-bad {
    background: var(--bad-soft);
    color: var(--bad);
  }

  .rv .ans {
    color: var(--ink);
    font-weight: 600;
    flex-basis: 100%;
  }

  .item.rv-ok {
    border-left-color: var(--ok);
  }

  .item.rv-bad {
    border-left-color: var(--bad);
  }

  .gapn {
    font-size: 11px;
    font-weight: 700;
    color: var(--c);
    margin: 0 2px 0 4px;
  }

  .foot {
    align-items: flex-start;
  }

  .match .lcol .chip {
    background: color-mix(in srgb, var(--c) 14%, var(--sheet));
    border-color: color-mix(in srgb, var(--c) 50%, var(--line));
    font-weight: 600;
  }

  .match .rcol .chip {
    background: color-mix(in srgb, var(--k-type) 10%, var(--sheet));
    border-color: color-mix(in srgb, var(--k-type) 45%, var(--line));
  }

  .match .rcol .chip .tag {
    background: color-mix(in srgb, var(--k-type) 25%, var(--sheet));
    color: var(--k-type);
  }

  .match .rcol .chip.paired .tag {
    background: var(--k-type);
    color: var(--sheet);
  }

  .colh {
    font-size: 13px;
    letter-spacing: .08em;
    text-transform: uppercase;
    font-weight: 800;
    color: var(--c);
    padding: 2px 4px;
  }

  .rcol .colh {
    color: var(--k-type);
  }

  @media (max-width: 820px) {
    .match .rcol {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 2px dashed var(--line);
    }
  }

  /* Pastel theme: the teacher's palette as fills (--p-*), deeper tones of the same hues for text and borders (--k-*) */
  :root {
    --k-match: #7a2fa5;
    --k-quiz: #735600;
    --k-tf: #6e5b00;
    --k-whack: #a8326e;
    --k-type: #08707a;
    --k-anagram: #8a4a00;
    --k-cloze: #146f4b;
    --k-unjumble: #0f6f64;
    --k-words: #5a3fc0;

    quiz: 'Choose the correct answer. If it is wrong, try again.',
    tf: 'Read the sentence. Is it true or false?',
    whack: 'Tap all the correct answers in each task. Wrong taps count as mistakes.',
    type: 'Type the answer and press Enter or Check. If it is wrong, change it and check again.',
    anagram: 'Tap the letters in the right order to build the word. Tap a letter in your answer to remove it.',
    cloze: 'Choose a word for each gap. Each choice is checked straight away. Some words in the list are extra.',
    unjumble: 'Tap the words in the right order to build the sentence. Tap a word in your answer to remove it.'
  };
  const KIND = {match: 'Match the pairs', quiz: 'Choose the answer', tf: 'True or false', whack: 'Choose all correct', type: 'Type the answer', anagram: 'Build the word', cloze: 'Fill the gaps', unjumble: 'Build the sentence'};
  const MSG = {ok: 'Correct!', bad: 'Incorrect. Try again.', part: 'Good! Find the rest.'};
  let scores = {};
  try {scores = JSON.parse(localStorage.getItem(KEY) || '{}') || {};} catch (e) {scores = {};}
  const save = () => {try {localStorage.setItem(KEY, JSON.stringify(scores));} catch (e) { } };
  const shuffle = a => {a = a.slice(); for (let i = a.length - 1; i > 0; i--) {const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]];} return a;};
  const norm = s => s.toLowerCase().replace(/[’‘`]/g, "'").replace(/[—–]/g, '-').replace(/\s+/g, ' ').replace(/[.!?]+$/, '').trim();
  const el = (tag, cls, txt) => {const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e;};
  const total = e => e.type === 'cloze' ? (e.text.match(/\*\*/g) || []).length / 2 : e.items.length;
  let current = -1;

  function renderNav() {
    const nav = document.getElementById('nav'), pk = document.getElementById('picker');
    nav.innerHTML = ''; pk.innerHTML = '';
    const add = (idx, label, n) => {
      const b = el('button'); if (idx === current) b.classList.add('on');
      b.style.setProperty('--c', 'var(--k-' + (idx < 0 ? 'words' : DATA.exercises[idx].type) + ')'); b.style.setProperty('--p', 'var(--p-' + (idx < 0 ? 'words' : DATA.exercises[idx].type) + ')');
      b.append(el('span', 'n', n || (idx === -2 ? '♪' : idx === -3 ? '⌂' : '★')), el('span', '', label));
      const sc = el('span', 'sc');
      if (idx >= 0 && scores[idx] != null) {const t = total(DATA.exercises[idx]); sc.textContent = scores[idx] + '/' + t; if (scores[idx] === t) sc.classList.add('full');}
      b.append(sc); b.onclick = () => open(idx); nav.append(b);
      const o = el('option', '', (n ? n + '. ' : '') + label + (idx >= 0 && scores[idx] != null ? '  (' + scores[idx] + '/' + total(DATA.exercises[idx]) + ')' : '')); o.value = idx; if (idx === current) o.selected = true; pk.append(o);
    };
    add(-3, 'Home', '');
    add(-1, 'Word list', '');
    add(-2, 'Flashcards with audio', '');
    nav.append(el('div', 'sep', 'Exercises'));
    let revSep = false;
    DATA.exercises.forEach((e, i) => {if (e.review && !revSep) {revSep = true; nav.append(el('div', 'sep', 'Review: previous list'));} add(i, e.title, i + 1);});
    const st = document.getElementById('stripe'); st.innerHTML = '';
    DATA.exercises.forEach((e, i) => {
      const c = el('button'); c.style.setProperty('--c', 'var(--k-' + e.type + ')'); c.style.setProperty('--p', 'var(--p-' + e.type + ')'); c.title = (i + 1) + '. ' + e.title; c.setAttribute('aria-label', c.title);
      if (scores[i] != null) c.classList.add('done'); if (i === current) c.classList.add('on'); c.onclick = () => open(i); st.append(c);
    });
    const done = Object.keys(scores).length;
    let got = 0, all = 0; Object.keys(scores).forEach(k => {got += scores[k]; all += total(DATA.exercises[k]);});
    document.getElementById('total').innerHTML = '<b>' + done + '</b> of ' + DATA.exercises.length + ' exercises done' + (all ? ' · ' + Math.round(got / all * 100) + '% correct on first try' : '');
  }
  document.getElementById('picker').onchange = e => open(+e.target.value);

  // One controller per exercise: instant right/wrong per item, answers only at the end on request
  function makeCtl(ex, idx, s, foot) {
    const n = total(ex);
    const ctl = {first: Array(n).fill(null), solved: Array(n).fill(false), answers: Array(n).fill(''), labels: Array(n).fill(''), fb: Array(n).fill(null), marks: Array(n).fill(null), ended: false, lockers: []};
    const res = el('div', 'result'), endBox = el('div', 'row'), btns = el('div', 'row');
    const finishB = el('button', 'btn', 'Finish exercise');
    const again = el('button', 'btn ghost', 'Start again'); again.onclick = () => open(idx);
    btns.append(finishB, again);
    if (idx < DATA.exercises.length - 1) {const nx = el('button', 'btn primary', 'Next exercise →'); nx.onclick = () => {open(idx + 1); window.scrollTo({top: 0});}; btns.append(nx);}
    const left = el('div', 'endcol'); left.append(res, endBox);
    foot.append(left, btns);
    const say = (i, kind) => {const f = ctl.fb[i]; if (!f) return; f.className = 'fb ' + (kind === 'ok' ? 'okt' : kind === 'bad' ? 'badt' : 'partt'); f.textContent = MSG[kind];};
    ctl.wrong = i => {if (ctl.ended || ctl.solved[i]) return; if (ctl.first[i] === null) ctl.first[i] = false; say(i, 'bad');};
    ctl.part = i => {if (!ctl.ended) say(i, 'part');};
    ctl.right = i => {if (ctl.ended || ctl.solved[i]) return; if (ctl.first[i] === null) ctl.first[i] = true; ctl.solved[i] = true; say(i, 'ok'); if (ctl.solved.every(Boolean)) end();};
    function end() {
      if (ctl.ended) return; ctl.ended = true; finishB.remove();
      ctl.lockers.forEach(f => f());
      const got = ctl.first.filter(x => x === true).length;
      scores[idx] = got; save(); renderNav();
      res.textContent = (got === n ? 'Perfect! ' : got >= n * 0.8 ? 'Great job! ' : got >= n * 0.5 ? 'Good effort! ' : 'Keep practising! ') + got + ' of ' + n + ' correct on first try';
      const a = el('button', 'btn', 'Show results'), b = el('button', 'btn', 'Show results with answers');
      a.onclick = () => reveal(false); b.onclick = () => reveal(true);
      endBox.append(a, b);
      left.append(sendBox(true));
      if (got === n) confetti(s);
    }
    function reveal(withAnswers) {
      endBox.innerHTML = '';
      const list = el('div', 'review');
      for (let i = 0; i < n; i++) {
        const ok = ctl.first[i] === true;
        const tag = ok ? '✓ Correct' : ctl.first[i] === false ? '✗ Mistake' : '✗ Not answered';
        const line = el('div', 'rv ' + (ok ? 'rv-ok' : 'rv-bad'));
        line.append(el('b', '', (i + 1) + '. ' + tag));
        if (ctl.labels[i]) line.append(document.createTextNode(' · ' + ctl.labels[i]));
        if (withAnswers && !ok) line.append(el('span', 'ans', 'Answer: ' + ctl.answers[i]));
        list.append(line);
        if (ctl.marks[i]) {const m = ctl.marks[i]; m.classList.remove('rv-ok', 'rv-bad'); m.classList.add(ok ? 'rv-ok' : 'rv-bad');}
      }
      const h = el('div', 'hint', withAnswers ? 'Your results with the correct answers:' : 'Your results (✓ correct on first try, ✗ mistake):');
      endBox.append(h);
      endBox.parentNode.append(list);
      const other = el('button', 'btn', withAnswers ? 'Hide answers' : 'Show answers too');
      other.onclick = () => {list.remove(); h.remove(); other.remove(); reveal(!withAnswers);};
      endBox.append(other);
    }
    finishB.onclick = end;
    return ctl;
  }

  function open(idx) {
    current = idx; renderNav();
    const s = document.getElementById('sheet'); s.innerHTML = '';
    s.style.setProperty('--c', 'var(--k-words)'); s.style.setProperty('--p', 'var(--p-words)');
    if (idx === -3) return home(s);
    if (idx === -2) return cards(s);
    if (idx < 0) return words(s);
    const ex = DATA.exercises[idx];
    s.style.setProperty('--c', 'var(--k-' + ex.type + ')'); s.style.setProperty('--p', 'var(--p-' + ex.type + ')');
    s.append(el('span', 'kind', (ex.review ? 'Review · ' : 'Exercise ' + (idx + 1) + ' · ') + KIND[ex.type]), el('h2', '', ex.title), el('p', 'howto', HOW[ex.type]));
    const box = el('div', 'items'); s.append(box);
    const foot = el('div', 'foot'); s.append(foot);
    const ctl = makeCtl(ex, idx, s, foot);
    ({match, quiz, tf, whack, type: typed, anagram, cloze, unjumble})[ex.type](ex, box, ctl);
  }

  function itemShell(box, ctl, i, qText) {
    const d = el('div', 'item'), q = el('div', 'q'); q.append(el('span', 'num', (i + 1) + '.'), document.createTextNode(qText));
    const fb = el('div', 'fb'); ctl.fb[i] = fb; ctl.marks[i] = d;
    d.append(q); box.append(d);
    return {d, fb};
  }

  function quiz(ex, box, ctl, tfMode) {
    ex.items.forEach((it, i) => {
      const {d, fb} = itemShell(box, ctl, i, it.q);
      const o = el('div', 'opts');
      const opts = tfMode ? it.opts : shuffle(it.opts);
      ctl.answers[i] = opts.find(x => x.ok).t;
      const bs = opts.map(op => {
        const b = el('button', 'opt', op.t);
        b.onclick = () => {
          if (op.ok) {b.classList.add('ok'); bs.forEach(x => x.disabled = true); ctl.right(i);}
          else {b.classList.add('bad'); b.disabled = true; ctl.wrong(i);}
        };
        return b;
      });
      ctl.lockers.push(() => bs.forEach(x => x.disabled = true));
      o.append(...bs); d.append(o, fb);
    });
  }
  function tf(ex, box, ctl) {
    quiz({items: ex.items.map(it => ({q: it.q, opts: [{t: 'True', ok: it.a[0] === 'True'}, {t: 'False', ok: it.a[0] === 'False'}]}))}, box, ctl, true);
  }

  function whack(ex, box, ctl) {
    ex.items.forEach((it, i) => {
      const {d, fb} = itemShell(box, ctl, i, it.q);
      const o = el('div', 'opts');
      const opts = shuffle(it.opts); const need = opts.filter(x => x.ok).length; let found = 0;
      ctl.answers[i] = opts.filter(x => x.ok).map(x => x.t).join(', ');
      const bs = opts.map(op => {
        const b = el('button', 'chip', op.t);
        b.onclick = () => {
          b.disabled = true;
          if (op.ok) {b.classList.add('ok'); if (++found === need) {bs.forEach(x => x.disabled = true); ctl.right(i);} else ctl.part(i);}
          else {b.classList.add('bad'); ctl.wrong(i);}
        };
        return b;
      });
      ctl.lockers.push(() => bs.forEach(x => x.disabled = true));
      o.append(...bs); d.append(o, fb);
    });
  }

  function typed(ex, box, ctl) {
    ex.items.forEach((it, i) => {
      const {d, fb} = itemShell(box, ctl, i, it.q);
      ctl.answers[i] = it.a[0];
      const r = el('div', 'row'), inp = el('input'); inp.type = 'text'; inp.id = 'ex' + current + '-' + i; inp.autocomplete = 'off'; inp.spellcheck = false; inp.setAttribute('autocapitalize', 'off');
      const b = el('button', 'btn', 'Check');
      const check = () => {
        if (!inp.value.trim() || inp.disabled) return;
        if (it.a.some(a => norm(a) === norm(inp.value))) {
          inp.classList.remove('bad'); inp.classList.add('ok'); inp.disabled = true; b.remove(); ctl.right(i);
          const nx = [...box.querySelectorAll('input')].find(x => !x.disabled); if (nx) nx.focus();
        } else {inp.classList.add('bad'); ctl.wrong(i);}
      };
      inp.oninput = () => inp.classList.remove('bad');
      b.onclick = check; inp.onkeydown = e => {if (e.key === 'Enter') check();};
      ctl.lockers.push(() => {inp.disabled = true; b.disabled = true;});
      r.append(inp, b); d.append(r, fb);
    });
  }

  // Shared builder for anagram letters and unjumble words
  function builder(box, ctl, i, qText, toks, target, joiner, tileCls) {
    const {d, fb} = itemShell(box, ctl, i, qText);
    let order = shuffle(toks.map((t, k) => k)); if (toks.length > 1 && order.every((v, k) => v === k)) order = order.reverse();
    const line = el('div', 'answer-line'), pool = el('div', tileCls === 'tile' ? 'tiles' : 'opts');
    const built = []; let done = false;
    const pbs = {};
    order.forEach(k => {const b = el('button', tileCls, toks[k]); b.onclick = () => {if (done) return; b.disabled = true; b.style.visibility = 'hidden'; built.push(k); draw(); if (built.length === toks.length) check();}; pbs[k] = b; pool.append(b);});
    function draw() {
      line.innerHTML = '';
      built.forEach((k, pos) => {const b = el('button', tileCls, toks[k]); b.onclick = () => {if (done) return; built.splice(pos, 1); pbs[k].disabled = false; pbs[k].style.visibility = ''; draw();}; line.append(b);});
    }
    function check() {
      const ok = built.map(k => toks[k]).join(joiner) === target;
      if (ok) {done = true; line.querySelectorAll('button').forEach(b => {b.disabled = true; b.classList.add('ok');}); pool.remove(); ctl.right(i);}
      else {line.querySelectorAll('button').forEach(b => b.classList.add('bad')); ctl.wrong(i);}
    }
    ctl.lockers.push(() => {done = true; line.querySelectorAll('button').forEach(b => b.disabled = true); Object.values(pbs).forEach(b => b.disabled = true);});
    d.append(line, pool, fb);
  }
  function anagram(ex, box, ctl) {
    ex.items.forEach((it, i) => {ctl.answers[i] = it.w; builder(box, ctl, i, it.hint, it.w.split(''), it.w, '', 'tile');});
  }
  function unjumble(ex, box, ctl) {
    ex.items.forEach((it, i) => {ctl.answers[i] = it.s; builder(box, ctl, i, 'Build the sentence', it.s.split(' '), it.s, ' ', 'chip');});
  }

  function match(ex, box, ctl) {
    const n = ex.items.length;
    const right = shuffle(ex.items.map((p, i) => ({t: p[1], i})));
    ex.items.forEach((p, i) => {ctl.answers[i] = p[1]; ctl.labels[i] = p[0];});
    let selL = null;
    const g = el('div', 'match'), cl = el('div', 'col lcol'), cr = el('div', 'col rcol');
    cl.append(el('div', 'colh', '① Tap a phrase')); cr.append(el('div', 'colh', '② Tap its pair'));
    const fb = el('div', 'fb');
    for (let i = 0; i < n; i++) ctl.fb[i] = fb;
    const mk = txt => {const b = el('button', 'chip'); b.append(el('span', 'tag', ''), document.createTextNode(txt)); return b;};
    let pairNo = 0;
    const lbs = ex.items.map((p, k) => {const b = mk(p[0]); b.onclick = () => {selL = k; lbs.forEach(y => y.classList.remove('sel')); b.classList.add('sel');}; return b;});
    const rbs = right.map(x => {
      const b = mk(x.t);
      b.onclick = () => {
        if (selL == null) {fb.className = 'fb'; fb.textContent = 'First tap a phrase on the left.'; return;}
        const L = selL; lbs[L].classList.remove('sel'); selL = null;
        if (x.i === L) {
          pairNo++;[lbs[L], b].forEach(y => {y.classList.add('ok', 'paired'); y.disabled = true; y.querySelector('.tag').textContent = pairNo;});
          ctl.right(L);
        } else {
          [lbs[L], b].forEach(y => y.classList.add('bad'));
          setTimeout(() => [lbs[L], b].forEach(y => y.classList.remove('bad')), 700);
          ctl.wrong(L);
        }
      };
      return b;
    });
    ctl.lockers.push(() => {lbs.forEach(b => b.disabled = true); rbs.forEach(b => b.disabled = true);});
    cl.append(...lbs); cr.append(...rbs); g.append(cl, cr);
    box.append(g, fb);
  }

  function cloze(ex, box, ctl) {
    const parts = ex.text.split(/\*\*(.+?)\*\*/);
    const answers = parts.filter((_, k) => k % 2 === 1);
    const bankWords = shuffle([...new Set(answers.concat(ex.distract || []))]);
    const bank = el('div', 'bank'); bankWords.forEach(w => bank.append(el('span', '', w)));
    const p = el('div', 'cloze'); const sels = []; const fb = el('div', 'fb');
    let gi = 0;
    parts.forEach((t, k) => {
      if (k % 2 === 0) {p.append(document.createTextNode(t)); return;}
      const i = gi++; ctl.answers[i] = answers[i]; ctl.labels[i] = 'gap ' + (i + 1); ctl.fb[i] = fb;
      const num = el('sup', 'gapn', String(i + 1));
      const s = el('select'); s.id = 'ex' + current + '-g' + i; s.setAttribute('aria-label', 'Gap ' + (i + 1));
      s.append(el('option', '', '…')); bankWords.forEach(w => {const o = el('option', '', w); o.value = w; s.append(o);});
      s.onchange = () => {
        if (s.selectedIndex === 0) return;
        if (s.value === answers[i]) {s.classList.remove('bad'); s.classList.add('ok'); s.disabled = true; ctl.right(i);}
        else {s.classList.add('bad'); ctl.wrong(i);}
      };
      sels.push(s); p.append(num, s);
    });
    ctl.lockers.push(() => sels.forEach(s => s.disabled = true));
    box.append(bank, p, fb);
  }

  function confetti(s) {
    const c = el('div', 'confetti'); const cols = ['match', 'quiz', 'tf', 'whack', 'type', 'anagram', 'cloze', 'unjumble'];
    for (let i = 0; i < 40; i++) {const p = el('i'); p.style.left = Math.random() * 100 + '%'; p.style.background = 'var(--k-' + cols[i % cols.length] + ')'; p.style.animationDelay = Math.random() * .4 + 's'; c.append(p);}
    s.append(c); setTimeout(() => c.remove(), 2200);
  }

  // Sending results to the teacher: a pre-filled Google Form opened by a real link (no account needed)
  const FORM = 'https://docs.google.com/forms/d/e/1FAIpQLSeU5OtxRWv9FFKZlzXcFNqe4wvK2-VtyyHlOenqg6yGoDb5jg/viewform?usp=pp_url';
  const F_NAME = 'entry.1946038210', F_TR = 'entry.121501776', F_RES = 'entry.269274832';
  const NKEY = 'fce-student-name';
  const getName = () => {try {return localStorage.getItem(NKEY) || '';} catch (e) {return '';} };
  const setName = v => {try {localStorage.setItem(NKEY, v);} catch (e) { } };
  const trainerName = () => (document.querySelector('h1') || {}).textContent || 'FCE Trainer';
  function resultsText() {
    const ex = DATA.exercises; let done = 0, got = 0, all = 0;
    ex.forEach((e, i) => {if (scores[i] != null) {done++; got += scores[i]; all += total(e);} });
    const lines = ['Exercises done: ' + done + ' of ' + ex.length + (all ? ' · ' + Math.round(got / all * 100) + '% correct on first try' : '')];
    try {lines.push('Flashcards: knows ' + known.size + ' of ' + DATA.words.length + ' words');} catch (e) { }
    lines.push('');
    ex.forEach((e, i) => lines.push((i + 1) + '. ' + e.title + ' — ' + (scores[i] != null ? scores[i] + '/' + total(e) : 'not done')));
    lines.push('', 'Sent: ' + new Date().toLocaleString('en-GB'));
    return lines.join('\n');
  }
  const formUrl = name => FORM + '&' + F_NAME + '=' + encodeURIComponent(name) + '&' + F_TR + '=' + encodeURIComponent(trainerName()) + '&' + F_RES + '=' + encodeURIComponent(resultsText());
  function sendBox(compact) {
    const box = el('div', 'sendbox' + (compact ? ' compact' : ''));
    if (!compact) box.append(el('h3', 'homeh', 'Send your results'), el('p', 'hint', 'Finished for today? Type your name once and send your results to your teacher. A form opens with everything filled in — just press Submit (Надіслати).'));
    const id = 'studentName' + (compact ? '-end' : '');
    const lab = el('label', 'slab', 'Your name'); lab.htmlFor = id;
    const inp = el('input'); inp.type = 'text'; inp.id = id; inp.value = getName(); inp.placeholder = 'e.g. Anna K.'; inp.autocomplete = 'name';
    const row = el('div', 'row'), send = el('a', 'btn primary sendbtn', 'Send results to my teacher'), copy = el('button', 'btn', 'Copy my results'), msg = el('div', 'fb');
    send.target = '_blank'; send.rel = 'noopener';
    const refresh = () => {const n = inp.value.trim(); send.href = n ? formUrl(n) : '#';};
    inp.oninput = () => {setName(inp.value.trim()); refresh(); msg.textContent = '';};
    send.onclick = e => {const n = inp.value.trim(); if (!n) {e.preventDefault(); msg.className = 'fb badt'; msg.textContent = 'Please type your name first.'; inp.focus(); return;} send.href = formUrl(n); msg.className = 'fb okt'; msg.textContent = 'The form is opening in a new tab. Press Submit (Надіслати) there.';};
    send.onmouseenter = refresh; send.onfocus = refresh;
    copy.onclick = () => {
      const txt = (inp.value.trim() ? inp.value.trim() + ' · ' : '') + trainerName() + '\n' + resultsText();
      const done = () => {msg.className = 'fb okt'; msg.textContent = 'Copied! Paste it into a message to your teacher.';};
      const fallback = () => {const ta = el('textarea'); ta.value = txt; ta.className = 'copyta'; box.append(ta); ta.select(); msg.className = 'fb'; msg.textContent = 'Select the text above and copy it.';};
      try {navigator.clipboard.writeText(txt).then(done, fallback);} catch (e) {fallback();}
    };
    refresh();
    row.append(send, copy); box.append(lab, inp, row, msg);
    return box;
  }

  function home(s) {
    s.style.setProperty('--c', 'var(--k-words)'); s.style.setProperty('--p', 'var(--p-words)');
    const wc = el('div', 'welcome'), wi = el('img'); wi.src = document.getElementById('tphoto').src; wi.alt = 'Your English teacher';
    const wt = el('div'); wt.append(el('b', '', 'Ready to learn something new?'), el('p', '', 'I chose these words and phrases especially for you. Every exercise brings you one step closer to your B2 First exam. Take it one step at a time — you\'ve got this!'));
    wc.append(wi, wt); s.append(wc);
    const sec = (title) => {const h = el('h3', 'homeh', title); s.append(h); const g = el('div', 'tilegrid'); s.append(g); return g;};
    const tile = (g, type, num, title, label, idx, score) => {
      const b = el('button', 'xtile'); b.style.setProperty('--c', 'var(--k-' + type + ')'); b.style.setProperty('--p', 'var(--p-' + type + ')');
      const top = el('div', 'xtop'); top.append(el('span', 'xnum', num)); if (score) {const sc = el('span', 'xsc' + (score.full ? ' full' : ''), score.text); top.append(sc);}
      b.append(top, el('span', 'xtitle', title), el('span', 'xlabel', label));
      b.onclick = () => {open(idx); window.scrollTo({top: 0});}; g.append(b);
    };
    const g0 = sec('Start here');
    tile(g0, 'words', '★', 'Word list', 'Read and listen', -1);
    tile(g0, 'match', '♪', 'Flashcards with audio', 'Learn the words', -2);
    const g1 = sec('Exercises'); let g2 = null;
    DATA.exercises.forEach((e, i) => {
      const sc = scores[i] != null ? {text: scores[i] + '/' + total(e), full: scores[i] === total(e)} : null;
      if (e.review && !g2) g2 = sec('Review: previous list');
      tile(e.review ? g2 : g1, e.type, String(i + 1), e.title, KIND[e.type], i, sc);
    });
    s.append(sendBox(false));
  }

  function words(s) {
    s.append(el('span', 'kind', 'Before you start'), el('h2', '', 'Word list'), el('p', 'howto', 'Read the list, then go to the exercises. They go from easy to difficult. Each type of exercise has its own colour:'));
    const lg = el('div', 'legend'); Object.keys(KIND).forEach(k => {const x = el('span', '', KIND[k]); x.style.setProperty('--c', 'var(--k-' + k + ')'); x.style.setProperty('--p', 'var(--p-' + k + ')'); lg.append(x);}); s.append(lg);
    const w = el('div', 'tw'), t = el('table', 'words');
    DATA.words.forEach(([en, ua]) => {const r = el('tr'), a = el('td', '', en), sp = el('button', 'spk', '🔊'); sp.setAttribute('aria-label', 'Listen: ' + en); sp.onclick = () => say(en); a.append(sp); r.append(a, el('td', '', ua)); t.append(r);});
    w.append(t); s.append(w);
    const f = el('div', 'foot'), r2 = el('div', 'row'), c = el('button', 'btn', 'Flashcards with audio'), b = el('button', 'btn primary', 'Start the exercises →'); c.onclick = () => open(-2); b.onclick = () => open(0); r2.append(c, b); f.append(el('span'), r2); s.append(f);
  }

  // Text-to-speech with the browser's own voices (British English preferred)
  let VOICE = null;
  function pickVoice() {try {const vs = speechSynthesis.getVoices(); VOICE = vs.find(v => v.lang === 'en-GB') || vs.find(v => /^en[-_]/i.test(v.lang)) || null;} catch (e) { } }
  try {pickVoice(); speechSynthesis.onvoiceschanged = pickVoice;} catch (e) { }
  function say(text) {
    try {
      const clean = text.replace(/\bsb\b/g, 'somebody').replace(/\bsth\b/g, 'something').replace(/[()…]/g, ' ').replace(/\s*\/\s*/g, ', ').replace(/\s+/g, ' ').trim();
      speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(clean); u.lang = 'en-GB'; u.rate = 0.9; if (VOICE) u.voice = VOICE; speechSynthesis.speak(u);
    } catch (e) { }
  }
  const CKEY = KEY + '-known';
  let known = new Set(); try {known = new Set(JSON.parse(localStorage.getItem(CKEY) || '[]'));} catch (e) { }
  const saveKnown = () => {try {localStorage.setItem(CKEY, JSON.stringify([...known]));} catch (e) { } };
  let cardState = {dir: 'en', onlyLearning: false, auto: true, order: null, pos: 0};
  let cardKeys = null;
  function cards(s) {
    s.style.setProperty('--c', 'var(--k-match)'); s.style.setProperty('--p', 'var(--p-match)');
    s.append(el('span', 'kind', 'Flashcards with audio'), el('h2', '', 'Flashcards'), el('p', 'howto', 'Tap the card to turn it over. Tap Listen to hear the English phrase. Mark each card "I know it" or "Still learning". You can practise only the cards you are still learning.'));
    const tg = el('div', 'toggles'), body = el('div');
    s.append(tg, body);
    const mkT = (label, on, fn) => {const b = el('button', 'btn' + (on ? ' on' : ''), label); b.onclick = () => {fn(); draw();}; return b;};
    const build = () => {let idxs = DATA.words.map((_, i) => i); if (cardState.onlyLearning) idxs = idxs.filter(i => !known.has(i)); cardState.order = idxs; cardState.pos = 0;};
    if (!cardState.order) build();
    function draw() {
      tg.innerHTML = '';
      tg.append(
        mkT('English → Ukrainian', cardState.dir === 'en', () => cardState.dir = 'en'),
        mkT('Ukrainian → English', cardState.dir === 'ua', () => cardState.dir = 'ua'),
        mkT('Shuffle', false, () => {cardState.order = shuffle(cardState.order); cardState.pos = 0;}),
        mkT('Only "Still learning"', cardState.onlyLearning, () => {cardState.onlyLearning = !cardState.onlyLearning; build();}),
        mkT('Auto audio', cardState.auto, () => cardState.auto = !cardState.auto));
      body.innerHTML = '';
      const ord = cardState.order;
      const bar = el('div', 'bar'), fill = el('i'); fill.style.width = (known.size / DATA.words.length * 100) + '%'; bar.append(fill);
      const kp = el('p', 'hint', 'You know ' + known.size + ' of ' + DATA.words.length + ' words'); kp.style.textAlign = 'center';
      body.append(kp, bar);
      if (!ord.length) {const p = el('p', 'howto', 'You marked all the words "I know it". Turn off "Only Still learning" to practise the whole list again.'); p.style.textAlign = 'center'; body.append(p); return;}
      const i = ord[cardState.pos], [en, ua] = DATA.words[i];
      const frontText = cardState.dir === 'en' ? en : ua, backText = cardState.dir === 'en' ? ua : en;
      const card = el('div', 'card'); card.tabIndex = 0; card.setAttribute('role', 'button'); card.setAttribute('aria-label', 'Card: ' + frontText + '. Tap to turn over');
      const inn = el('div', 'card-in'), f = el('div', 'face front'), b = el('div', 'face back');
      f.append(el('span', 'lbl', cardState.dir === 'en' ? 'English' : 'Ukrainian'), el('div', 'big', frontText), el('span', 'tip', 'tap to turn over'));
      b.append(el('span', 'lbl', cardState.dir === 'en' ? 'Ukrainian' : 'English'), el('div', 'big', backText));
      if (known.has(i)) {const k = el('span', 'lbl', '✓ I know it'); k.style.left = 'auto'; k.style.right = '18px'; f.append(k);}
      inn.append(f, b); card.append(inn);
      const flip = () => {card.classList.toggle('flipped'); if (cardState.auto && cardState.dir === 'ua' && card.classList.contains('flipped')) say(en);};
      card.onclick = flip; card.onkeydown = e => {if (e.key === ' ' || e.key === 'Enter') {e.preventDefault(); flip();} };
      const go = d => {cardState.pos = (cardState.pos + d + ord.length) % ord.length; draw();};
      const nb = el('div', 'cardbar');
      const prev = el('button', 'btn', '← Back'), next = el('button', 'btn', 'Next →'), sayB = el('button', 'btn say', '🔊 Listen'), cnt = el('span', 'count', (cardState.pos + 1) + ' / ' + ord.length);
      prev.onclick = () => go(-1); next.onclick = () => go(1); sayB.onclick = () => say(en);
      nb.append(prev, cnt, next);
      const kb = el('div', 'cardbar'), kn = el('button', 'btn know', '✓ I know it'), lr = el('button', 'btn learn', '↻ Still learning');
      kn.onclick = () => {known.add(i); saveKnown(); if (cardState.onlyLearning) {ord.splice(cardState.pos, 1); if (cardState.pos >= ord.length) cardState.pos = 0; draw();} else go(1);};
      lr.onclick = () => {known.delete(i); saveKnown(); go(1);};
      kb.append(sayB, lr, kn);
      body.append(card, nb, kb, el('div', 'keys', 'On a computer: Space turns the card over, ← → move between cards.'));
      if (cardState.auto && cardState.dir === 'en') say(en);
      cardKeys = e => {if (current !== -2 || /input|select|textarea/i.test(e.target.tagName)) return; if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1); else if (e.key === ' ' && e.target === document.body) {e.preventDefault(); flip();} };
    }
    draw();
  }
  document.addEventListener('keydown', e => {if (cardKeys) cardKeys(e);});

  open(-3);
</script>
